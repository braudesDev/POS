<div class="pos-container">
  <div class="pos-grid">
    <!-- Panel Izquierdo -->
    <div class="left-panel">
      <!-- Escáner fijo arriba -->
      <div class="scanner-fixed">
        <app-scanner (productoAgregado)="onProductoAgregado()"></app-scanner>
      </div>

      <!-- Carrito con scroll propio -->
      <div class="cart-scrollable">
        <app-cart></app-cart>
      </div>
    </div>

    <!-- Panel Derecho -->
    <div class="right-panel">
      <app-checkout></app-checkout>
    </div>
  </div>
</div>
