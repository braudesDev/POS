<div class="cart-container">
  <div class="cart-header">
    <h3>Carrito de Ventas</h3>
    <span class="badge">{{ totalItems }} items</span>
  </div>

  <!-- Carrito vacío -->
  <div
    *ngIf="(carritoService.carrito$ | async)?.length === 0"
    class="empty-cart"
  >
    <mat-icon>shopping_cart</mat-icon>
    <p>Carrito vacío</p>
    <small>Escanea o busca un producto</small>
  </div>

  <!-- Items del carrito -->
  <ng-container *ngIf="carritoService.carrito$ | async as carrito">
    <div *ngFor="let item of carrito" class="cart-item">
      <div class="item-info">
        <div class="item-name">{{ item.producto.nombre }}</div>
        <div class="item-price">${{ item.producto.precio }}</div>
      </div>

      <div class="item-controls">
        <button
          class="btn-qty"
          (click)="disminuirCantidad(item)"
          [disabled]="item.cantidad <= 1"
        >
          −
        </button>
        <span class="item-qty">{{ item.cantidad }}</span>
        <button class="btn-qty" (click)="aumentarCantidad(item)">+</button>
      </div>

      <div class="item-subtotal">${{ item.subtotal }}</div>

      <button
        class="btn-remove"
        (click)="eliminar(item.producto.id!)"
        title="Eliminar"
      >
        <span class="remove-icon">✕</span>
      </button>
    </div>

    <!-- Footer -->
    <div *ngIf="carrito.length > 0" class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <strong>${{ carritoService.getTotal() }}</strong>
      </div>

      <button class="btn-clear" (click)="limpiarCarrito()">
        Limpiar Carrito
      </button>
    </div>
  </ng-container>
</div>
