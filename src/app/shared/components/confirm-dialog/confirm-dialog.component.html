<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
  <p>{{ data.mensaje }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>
    {{ data.cancelText || "Cancelar" }}
  </button>
  <button
    mat-raised-button
    [color]="data.color || 'warn'"
    [mat-dialog-close]="true"
  >
    <mat-icon *ngIf="data.color === 'warn'">delete</mat-icon>
    <mat-icon *ngIf="data.color !== 'warn'">check</mat-icon>
    {{ data.confirmText || "Confirmar" }}
  </button>
</mat-dialog-actions>
